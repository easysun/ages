name: PR 59 viewer diagnostic

on:
  push:
    branches: [diagnostics/pr59-viewer-ci]

permissions:
  contents: read

jobs:
  viewer-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:local
      - run: npm run db:migrate:local
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Retain failed Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr59-viewer-failed-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3

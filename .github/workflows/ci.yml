name: Verify

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:local
      - run: npm run db:migrate:local
      - run: npx playwright install --with-deps chromium
      - run: npm run check

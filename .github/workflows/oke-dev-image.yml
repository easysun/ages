name: OKE development ARM64 image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oke-dev-image.yml"
      - ".dockerignore"
      - "Dockerfile.oke-dev"
      - "deploy/oke-dev/**"
      - "src/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Native ARM64 avoids QEMU and keeps the small OKE worker nodes out of CI.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable source-SHA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.oke-dev
          platforms: linux/arm64
          push: true
          tags: ghcr.io/easysun/ages-dev:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/easysun/ages
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
